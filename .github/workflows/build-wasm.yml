name: Build WebAssembly

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-wasm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasm-build-main
  cancel-in-progress: true

jobs:
  build:
    name: Compile browser resources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile WebAssembly
        run: cmake --build build --parallel 2

      - name: Verify outputs
        run: |
          test -s dist/mkwii-web.js
          test -s dist/mkwii-web.wasm
          ls -lh dist/

      - name: Commit generated browser resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/mkwii-web.js dist/mkwii-web.wasm
          if git diff --cached --quiet; then
            echo "Browser resources are already up to date."
            exit 0
          fi
          git commit -m "Build WebAssembly browser resources"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after fetching latest main."
            sleep 2
          done
          echo "Could not push generated resources after five attempts."
          exit 1
