name: Build WebAssembly

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/translator-smoke/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-wasm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wasm-build-main
  cancel-in-progress: true

jobs:
  build:
    name: Translate PowerPC branch/memory programs and compile browser resources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check out pinned upstream translator
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/patchzyy/Wiicompiled.git "$RUNNER_TEMP/Wiicompiled"
          git -C "$RUNNER_TEMP/Wiicompiled" checkout 03151e0a3429adb92dd9082fb815fbf194df3c1d
          echo "Upstream translator revision: $(git -C "$RUNNER_TEMP/Wiicompiled" rev-parse HEAD)"

      - name: Generate C++ from synthetic PowerPC instructions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          dotnet run --project tools/translator-smoke/TranslatorSmoke.csproj \
            -p:UpstreamRoot="$RUNNER_TEMP/Wiicompiled" -- \
            generated/translated_addi_smoke.cpp
          test -s generated/translated_addi_smoke.cpp

      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: |
          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DWII_COMPILED_UPSTREAM_ROOT="$RUNNER_TEMP/Wiicompiled"

      - name: Compile WebAssembly
        run: cmake --build build --parallel 2

      - name: Verify outputs
        run: |
          test -s dist/mkwii-web.js
          test -s dist/mkwii-web.wasm
          ls -lh dist/

      - name: Commit generated browser resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/mkwii-web.js dist/mkwii-web.wasm
          if git diff --cached --quiet; then
            echo "Browser resources are already up to date."
            exit 0
          fi
          git commit -m "Build v0.10 translated PowerPC branch and memory tests"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after fetching latest main."
            sleep 2
          done
          echo "Could not push generated resources after five attempts."
          exit 1
